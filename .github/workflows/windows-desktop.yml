name: Build Windows Desktop App (TinyJS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Native App (WebView2 + TinyJS)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Verify typecheck, lint, and oxlint
        run: bun run check

      - name: Install TinyJS CLI for Windows
        shell: pwsh
        run: |
          irm https://tinyjs.app/install.ps1 | iex
          $tinyjsDir = Join-Path $env:LOCALAPPDATA 'tinyjs'
          echo "$tinyjsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run TinyJS Doctor
        shell: pwsh
        continue-on-error: true
        run: |
          tinyjs version
          tinyjs doctor

      - name: Extract App Version from tinyjs.json
        id: meta
        shell: pwsh
        run: |
          $config = Get-Content tinyjs.json -Raw | ConvertFrom-Json
          $version = $config.version
          $tag = if ("${{ github.ref }}" -like "refs/tags/*") { "${{ github.ref_name }}" } else { "v$version-windows" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building RTL Markdown Studio v$version (Tag: $tag)"

      - name: Build Windows Executable (rtl-markdown-studio.exe)
        shell: pwsh
        run: |
          tinyjs build --cli
          @"
          RTL Markdown Studio v${{ steps.meta.outputs.version }} — Portable Windows Desktop App (1920x1080)
          ===============================================================================

          این نسخه کاملاً پرتابل (Portable) است و نیازی به نصب ندارد:
          ۱. ابتدا تمامی محتویات فایل زیپ را در یک پوشه Extract (خارج از حالت فشرده) کنید.
          ۲. فایل rtl-markdown-studio.exe را اجرا کنید (فایل launcher.exe باید در کنار آن در همان پوشه باقی بماند).

          Portable Windows 10 / 11 Edition (No Installer Required):
          1. Extract all files from the ZIP archive into a folder.
          2. Run rtl-markdown-studio.exe (keep launcher.exe in the same directory).
          "@ | Out-File -FilePath dist\README-WINDOWS.txt -Encoding utf8
          Get-ChildItem -Path dist -Recurse

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath RTL-Markdown-Studio-Windows-x64.zip -Force
          Copy-Item RTL-Markdown-Studio-Windows-x64.zip "RTL-Markdown-Studio-v${{ steps.meta.outputs.version }}-Windows-x64-Portable.zip" -Force

      - name: Upload Windows Desktop App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL-Markdown-Studio-v${{ steps.meta.outputs.version }}-Windows-x64
          path: |
            RTL-Markdown-Studio-v${{ steps.meta.outputs.version }}-Windows-x64-Portable.zip
            RTL-Markdown-Studio-Windows-x64.zip
            dist/rtl-markdown-studio.exe
            dist/launcher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows Desktop App to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "RTL Markdown Studio v${{ steps.meta.outputs.version }} — Windows Portable (1920x1080 / 60FPS GPU)"
          body: |
            ## نسخه دسکتاپ پرتابل ویندوز `v${{ steps.meta.outputs.version }}` (TinyJS + WebView2)

            این نسخه **کاملاً پرتابل (Portable)** است، نیازی به نصب ندارد و به‌صورت خودکار توسط GitHub Actions ساخته و منتشر شده است.

            ### تغییرات نسخه `v${{ steps.meta.outputs.version }}`:
            - **رزولوشن پیش‌فرض Full HD (`1920 × 1080`)** با تایتل‌بار سفارشی تیره بدون نوار سفید کلاسیک ویندوز
            - **رندر ۶۰ فریم بر ثانیه (60 FPS) با حفظ ۱۰۰٪ انیمیشن‌ها روی سیستم‌های ضعیف**: حذف بار اضافی DWM Vibrancy و Blurهای چندمرحله‌ای، انتقال بزرگ‌نمایی داک به GPU Scale بدون Layout Reflow و همگام‌سازی نشانگر سه‌بعدی با `requestAnimationFrame`
            - **نسخه پرتابل واقعی**: بدون نیاز به نصب؛ قابل اجرا از هر پوشه یا فلش مموری روی ویندوز ۱۰ و ۱۱

            ### راهنمای دانلود و اجرا روی ویندوز ۱۰ و ۱۱:
            1. فایل **`RTL-Markdown-Studio-v${{ steps.meta.outputs.version }}-Windows-x64-Portable.zip`** (یا `RTL-Markdown-Studio-Windows-x64.zip`) را از بخش **Assets** پایین همین صفحه دانلود کنید.
            2. فایل زیپ را در یک پوشه **Extract** (خارج از حالت فشرده) کنید.
            3. فایل **`rtl-markdown-studio.exe`** را اجرا کنید (توجه: فایل `launcher.exe` باید در کنار `rtl-markdown-studio.exe` در همان پوشه باشد).
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            RTL-Markdown-Studio-v${{ steps.meta.outputs.version }}-Windows-x64-Portable.zip
            RTL-Markdown-Studio-Windows-x64.zip
            dist/rtl-markdown-studio.exe
            dist/launcher.exe
            dist/README-WINDOWS.txt
            out/delta-manifest.json
