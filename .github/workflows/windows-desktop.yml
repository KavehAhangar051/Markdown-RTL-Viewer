name: Build Windows Desktop App (TinyJS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Native App (WebView2 + TinyJS)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify typecheck, lint, oxlint, and unit tests
        run: npm run check

      - name: Install TinyJS CLI for Windows
        shell: pwsh
        run: |
          irm https://tinyjs.app/install.ps1 | iex
          $tinyjsDir = Join-Path $env:LOCALAPPDATA 'tinyjs'
          echo "$tinyjsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run TinyJS Doctor
        shell: pwsh
        continue-on-error: true
        run: |
          tinyjs version
          tinyjs doctor

      - name: Build Windows Executable (rtl-markdown-studio.exe)
        shell: pwsh
        run: |
          tinyjs build --cli
          @"
          RTL Markdown Studio — Windows Desktop App (TinyJS + WebView2)
          =============================================================

          راهنمای اجرا در ویندوز ۱۰ و ۱۱:
          ۱. ابتدا تمامی محتویات فایل زیپ (RTL-Markdown-Studio-Windows-x64.zip) را در یک پوشه Extract (خارج از حالت فشرده) کنید.
          ۲. فایل rtl-markdown-studio.exe را اجرا کنید (فایل launcher.exe باید در کنار آن در همان پوشه باقی بماند).

          How to run on Windows 10 / 11:
          1. Extract all files from RTL-Markdown-Studio-Windows-x64.zip into a folder.
          2. Run rtl-markdown-studio.exe (keep launcher.exe in the same directory).
          "@ | Out-File -FilePath dist\README-WINDOWS.txt -Encoding utf8
          Get-ChildItem -Path dist -Recurse

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath RTL-Markdown-Studio-Windows-x64.zip -Force

      - name: Upload Windows Desktop App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL-Markdown-Studio-Windows-x64
          path: |
            RTL-Markdown-Studio-Windows-x64.zip
            dist/rtl-markdown-studio.exe
            dist/launcher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows Desktop App to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0-windows' }}
          name: "RTL Markdown Studio — Windows Desktop App (TinyJS x64)"
          body: |
            ## نسخه دسکتاپ بومی ویندوز (TinyJS + WebView2)

            این نسخه به‌صورت خودکار توسط GitHub Actions ساخته و منتشر شده است.

            ### راهنمای دانلود و اجرا روی ویندوز ۱۰ و ۱۱:
            1. فایل **`RTL-Markdown-Studio-Windows-x64.zip`** را از بخش **Assets** پایین همین صفحه دانلود کنید.
            2. فایل زیپ را در یک پوشه **Extract** (خارج از حالت فشرده) کنید.
            3. فایل **`rtl-markdown-studio.exe`** را اجرا کنید (توجه: فایل `launcher.exe` باید در کنار `rtl-markdown-studio.exe` در همان پوشه باشد).

            ### امکانات نسخه ویندوز:
            - اجرای بومی و سبک (~6MB) بر پایه **Windows WebView2** و **txiki.js** بدون نیاز به باندل کردن کرومیوم حجیم
            - دیالوگ‌های بومی باز کردن و ذخیره فایل ویندوز (`Ctrl+O` / `Ctrl+S`)
            - منوی بومی ویندوز (`File`, `Edit`, `View`, `Help`) و پشتیبانی از Drag & Drop مستقیم فایل از Windows Explorer
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            RTL-Markdown-Studio-Windows-x64.zip
            dist/rtl-markdown-studio.exe
            dist/launcher.exe
            dist/README-WINDOWS.txt
